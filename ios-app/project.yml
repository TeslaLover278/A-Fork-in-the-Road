# XcodeGen spec — `brew install xcodegen`, then run `xcodegen generate` in
# this folder to produce ForkInTheRoad.xcodeproj.
#
# This exists because the source was written on a machine without Xcode, so
# no .xcodeproj could be created or verified directly. Generating it from a
# spec means the deployment target and the required location-permission keys
# can't be forgotten during setup. SETUP.md still documents the fully manual
# route if you'd rather not install XcodeGen.
name: ForkInTheRoad

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  ForkInTheRoad:
    type: application
    platform: iOS
    sources:
      # Picks up Models/, Services/, Content/, Views/, Assets.xcassets
      # (AppIcon) and ForkInTheRoadApp.swift. Only one @main struct lives
      # in here.
      - path: ForkInTheRoad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ReaganH.ForkInTheRoad
        PRODUCT_NAME: A Fork in the Road
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "A Fork in the Road"

        # Info.plist is generated from these rather than checked in. The
        # location key is not optional: iOS refuses to show a permission
        # prompt without it and CLLocationManager traps on the request.
        # Mirrors the table in Info-Plist-Additions.md.
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Fork in the Road needs your location to show turn-by-turn directions while you drive."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

        # Points at Assets.xcassets/AppIcon.appiconset (single 1024x1024
        # source image). actool generates every required device/marketing
        # size from it and stamps CFBundleIconName automatically — without
        # this, App Store Connect rejects the upload as missing icons.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # The MVP requests When-In-Use only. To add background tracking, add
        # NSLocationAlwaysAndWhenInUseUsageDescription here plus the
        # Background Modes section described in Info-Plist-Additions.md.
